<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Odisseia</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    fieldset {
      display: block;
      border: 0;
      padding: 0;
      margin: 0;
    }

    .important-input {
      display: block;
      width: calc(100% - 20px);
      background-color: var(--bg-section);
      border: 1px solid var(--border-gold);
      border-radius: 5px;
      color: var(--text-light);
      padding: 10px;
      font-size: 1.1em;
      margin: 10px;
    }

    .important-input:focus {
      border-color: var(--accent-gold);
      outline: none;
    }

    .important-button {
      transition: transform 0.2s;
      width: 160px;
      background-color: var(--bg-section);
      border: 1px solid var(--border-gold);
      border-radius: 5px;
      color: var(--text-light);
      padding: 10px;
      font-size: 1.1em;
      margin: 10px;
      cursor: pointer;
    }

    .important-button:hover {
      transform: scale(1.05);
    }

    #dashboard {
      display: none;
    }

    .fichas-lista {
      min-height: 100px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border-gold);
      border-radius: 5px;
      padding: 12px;
      margin: 10px 0;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <div class="sheet-wrapper">

    <!-- HEADER -->
    <div class="sheet-header">
      <h1>Odisseia</h1>
      <p>Dashboard</p>
    </div>

    <div class="tab-content active" id="tab-geral">
      <div class="grid-2">

        <!-- Fichas que você tem acesso -->
        <div class="panel">
          <h1>Fichas</h1>
          <div id="dashboard">
            <div id="lista-fichas" class="fichas-lista">Carregando fichas...</div>
            <button class="important-button" onclick="criarNovaFicha()">Nova ficha</button>
          </div>
        </div>

        <!-- login -->
        <div>
          <div class="panel">
            <div id="auth-container">
              <h1>Login</h1>
              <fieldset class="text">
                <input class="important-input" type="email" id="email" placeholder="E‑mail">
                <input class="important-input" type="password" id="password" placeholder="Senha">
              </fieldset>
              <fieldset class="button">
                <button class="important-button" onclick="signUp()">Criar conta</button>
                <button class="important-button" onclick="signIn()">Entrar</button>
              </fieldset>
              <p id="auth-error" style="color:red; margin: 10px;"></p>
            </div>
            <button class="important-button" onclick="signOut()">Sair</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Configuração do Firebase (substitua com seus dados) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD0GKHekJIBroBaQbbKIagcaZ52ljsgT6A",
      authDomain: "fichas-odisseia.firebaseapp.com",
      projectId: "fichas-odisseia",
      storageBucket: "fichas-odisseia.firebasestorage.app",
      messagingSenderId: "438632062292",
      appId: "1:438632062292:web:68e9584cf8f5ffcf2e3cc1",
      measurementId: "G-JRFYC354YB"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

  </script>
  <script>
    // Autenticação
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.createUserWithEmailAndPassword(email, password);
        // auth.onAuthStateChanged dispara automaticamente
      } catch (e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (e) {
        document.getElementById('auth-error').textContent = e.message;
      }
    }

    // Observer de estado da autenticação
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        carregarDashboard(user.uid);
      } else {
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
      }
    });

    // Função placeholder para listar fichas
    async function carregarDashboard(uid) {
      const lista = document.getElementById('lista-fichas');
      lista.innerHTML = 'Carregando suas fichas...';
      try {
        const snapshot = await db.collection('sheets').where('owner', '==', uid).get();
        if (snapshot.empty) {
          lista.innerHTML = 'Nenhuma ficha encontrada.';
          return;
        }
        lista.innerHTML = '';
        snapshot.forEach(doc => {
          const dados = doc.data();
          const div = document.createElement('div');
          div.style.display = 'flex';
          div.style.justifyContent = 'space-between';
          div.style.alignItems = 'center';
          div.style.marginBottom = '8px';
          div.innerHTML = `<strong>${dados.name || 'Sem nome'}</strong> 
          <button style="color: var(--accent-gold); background: transparent; border: 1px solid var(--border-gold); padding: 4px 8px; cursor: pointer;" 
            onclick="abrirFicha('${doc.id}')">Abrir</button>`;
          lista.appendChild(div);
        });
      } catch (e) {
        lista.innerHTML = 'Erro ao carregar fichas.';
        console.error(e);
      }
    }

    async function signOut() {
      try {
        await auth.signOut();
        // O observer onAuthStateChanged vai detectar o logout e mostrar o login novamente.
      } catch (e) {
        console.error('Erro ao deslogar:', e);
      }
    }

    // Placeholder para criar nova ficha
    async function criarNovaFicha() {
      const nome = prompt('Nome do personagem:');
      if (!nome) return;
      const user = auth.currentUser;
      if (!user) return;
      try {
        const docRef = await db.collection('sheets').add({
          owner: user.uid,
          name: nome,
          data: {} // depois preencherá a ficha com valores padrão
        });
        alert('Ficha criada!');
        carregarDashboard(user.uid);
      } catch (e) {
        alert('Erro ao criar ficha: ' + e.message);
      }
    }

    function abrirFicha(id) {
      window.location.href = 'ficha.html?sheetId=' + id; // ajuste o caminho conforme necessário
    }
  </script>

</body>

</html>
