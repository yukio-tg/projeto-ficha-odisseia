<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Odisseia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="sheet-wrapper">
    <div class="sheet-header">
      <h1>Odisseia</h1>
      <p>Dashboard</p>
    </div>

    <div class="tab-content active" id="tab-geral">
      <div class="grid-2">
        <div class="panel">
          <h1>Fichas</h1>
          <div id="dashboard">
            <!-- Minhas fichas -->
            <div id="lista-fichas" class="fichas-lista">Carregando fichas...</div>
            <button class="important-button" onclick="criarNovaFicha()">Nova ficha</button>

            <!-- Fichas compartilhadas comigo -->
            <div id="fichas-compartilhadas-section" style="display:none; margin-top:18px;">
              <h2 class="dashboard-section-title">Compartilhadas comigo</h2>
              <div id="lista-fichas-compartilhadas" class="fichas-lista">Carregando...</div>
            </div>
          </div>
        </div>
        <div>
          <div class="panel">
            <div id="auth-container">
              <h1>Login</h1>
              <fieldset class="text">
                <input class="important-input" type="email" id="email" placeholder="E‑mail">
                <input class="important-input" type="password" id="password" placeholder="Senha">
              </fieldset>
              <fieldset class="button">
                <button class="important-button" onclick="signUp()">Criar conta</button>
                <button class="important-button" onclick="signIn()">Entrar</button>
              </fieldset>
              <p id="auth-error" style="color:red; margin: 10px;"></p>
            </div>
            <button class="important-button" onclick="signOut()">Sair</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD0GKHekJIBroBaQbbKIagcaZ52ljsgT6A",
      authDomain: "fichas-odisseia.firebaseapp.com",
      projectId: "fichas-odisseia",
      storageBucket: "fichas-odisseia.firebasestorage.app",
      messagingSenderId: "438632062292",
      appId: "1:438632062292:web:68e9584cf8f5ffcf2e3cc1"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ── Autenticação ──────────────────────────────────────────────────────────

    async function ensureUserDoc(uid, email) {
      try {
        // Armazena o email normalizado para que a busca por email seja case-insensitive
        await db.collection('users').doc(uid).set({ email: email.trim().toLowerCase() }, { merge: true });
      } catch (e) { console.warn('[Auth] ensureUserDoc:', e); }
    }

    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await ensureUserDoc(cred.user.uid, email);
      } catch (e) { document.getElementById('auth-error').textContent = e.message; }
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        await ensureUserDoc(cred.user.uid, email);
      } catch (e) { document.getElementById('auth-error').textContent = e.message; }
    }

    async function signOut() {
      try { await auth.signOut(); } catch (e) { console.error(e); }
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        // Garante que o perfil existe (para logins já existentes antes desta versão)
        await ensureUserDoc(user.uid, user.email);
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        carregarDashboard(user.uid);
      } else {
        document.getElementById('auth-container').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('fichas-compartilhadas-section').style.display = 'none';
      }
    });

    // ── Ícones de classe ──────────────────────────────────────────────────────

    const CLASS_SVG_SLUG = {
      coracao: 'coracao', arcanista: 'arcanista', certeiro: 'certeiro',
      terrivel: 'terrivel', feromantico: 'feromantico', teurgista: 'teurgista',
      engenhoso: 'engenhoso', treinador: 'treinador',
    };

    // Paleta de Detalhes (metalico) — mesmos valores de theme.js
    const METALICO_PAL = {
      'vermelho-saturado': { h: 0,   s: 90, b:  0 },
      'vermelho-escuro':   { h: 355, s: 72, b: -4 },
      'vermelho-claro':    { h: 5,   s: 55, b: +5 },
      'laranja':           { h: 25,  s: 88, b:  0 },
      'marrom':            { h: 22,  s: 70, b:  0 },
      'bege':              { h: 38,  s: 46, b: +4 },
      'amarelo-banana':    { h: 57,  s: 78, b: +9 },
      'amarelo-escuro':    { h: 45,  s: 75, b:  0 },
      'amarelo-saturado':  { h: 50,  s: 97, b: +3 },
      'verde-escuro':      { h: 120, s: 72, b: -4 },
      'verde-saturado':    { h: 125, s: 88, b:  0 },
      'verde-claro':       { h: 140, s: 55, b: +5 },
      'ciano-escuro':      { h: 185, s: 72, b: -4 },
      'ciano-saturado':    { h: 180, s: 90, b:  0 },
      'ciano-claro':       { h: 175, s: 55, b: +5 },
      'azul-claro':        { h: 210, s: 58, b: +5 },
      'azul-saturado':     { h: 220, s: 90, b:  0 },
      'azul-escuro':       { h: 230, s: 72, b: -4 },
      'roxo-escuro':       { h: 265, s: 72, b: -4 },
      'roxo-claro':        { h: 280, s: 50, b: +5 },
      'roxo-saturado':     { h: 270, s: 90, b:  0 },
      'rosa-escuro':       { h: 330, s: 65, b: -4 },
      'rosa-claro':        { h: 340, s: 50, b: +5 },
      'rosa-saturado':     { h: 335, s: 88, b:  0 },
      'cinza-escuro':      { h: 20,  s:  8, b: -8 },
      'cinza':             { h: 20,  s:  5, b:  0 },
      'cinza-claro':       { h: 20,  s:  5, b: +12 },
      'preto':             { h: 0,   s:  0, b: -10 },
      'branco':            { h: 38,  s: 18, b: +22 },
    };
    const DEFAULT_METALICO = METALICO_PAL['amarelo-escuro'];

    /** Computa o tom gold3 do grupo Detalhes dado o id do metalico. */
    function computeGold3(metalicoId) {
      const p = METALICO_PAL[metalicoId] || DEFAULT_METALICO;
      const sat = Math.min(p.s, 92);
      const bh  = p.b * 0.5;
      const l   = Math.max(56, Math.min(90, 75 + bh));
      return `hsl(${p.h},${sat.toFixed(1)}%,${l.toFixed(1)}%)`;
    }

    /** Remove acentos e converte para minúsculas (slug). */
    function slugClasse(str) {
      return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    /**
     * Cria o elemento de ícone de classe colorido com CSS mask.
     * @param {string} classeNome  - valor do campo classe-nome
     * @param {string} metalicoId - id da cor de Detalhes da ficha
     */
    function criarIconeClasse(classeNome, metalicoId) {
      const slug = slugClasse(classeNome);
      const svgNome = CLASS_SVG_SLUG[slug];
      if (!svgNome) return null;

      const color = computeGold3(metalicoId);
      const icon = document.createElement('span');
      icon.className = 'ficha-classe-icon';
      icon.title = classeNome || '';
      const url = `/image/${svgNome}.svg`;
      icon.style.maskImage = `url('${url}')`;
      icon.style.webkitMaskImage = `url('${url}')`;
      icon.style.backgroundColor = color;
      return icon;
    }

    // ── Minhas fichas ─────────────────────────────────────────────────────────

    async function carregarDashboard(uid) {
      const lista = document.getElementById('lista-fichas');
      lista.innerHTML = 'Carregando suas fichas...';
      try {
        const snapshot = await db.collection('sheets').where('owner', '==', uid).get();
        if (snapshot.empty) {
          lista.innerHTML = 'Nenhuma ficha encontrada.';
        } else {
          lista.innerHTML = '';
          snapshot.forEach(doc => {
            const dados = doc.data();
            const sheetId = doc.id;
            const div = document.createElement('div');
            div.className = 'ficha-row';

            const classeNome  = dados.data?.fields?.['classe-nome'] || '';
            const metalicoId  = dados.theme?.metalico || 'amarelo-escuro';
            const icone = criarIconeClasse(classeNome, metalicoId);

            const nomeSpan = document.createElement('span');
            nomeSpan.textContent = dados.name || 'Sem nome';
            nomeSpan.className = 'ficha-nome';
            nomeSpan.onclick = () => editarNomeFicha(sheetId, dados.name);

            const botoesDiv = document.createElement('div');
            botoesDiv.className = 'ficha-botoes';

            const btnAbrir = document.createElement('button');
            btnAbrir.textContent = 'Abrir';
            btnAbrir.className = 'ficha-btn ficha-btn-abrir';
            btnAbrir.onclick = () => abrirFicha(sheetId);

            const btnExcluir = document.createElement('button');
            btnExcluir.textContent = 'Excluir';
            btnExcluir.className = 'ficha-btn ficha-btn-excluir';
            btnExcluir.onclick = () => excluirFicha(sheetId, dados.name);

            botoesDiv.appendChild(btnAbrir);
            botoesDiv.appendChild(btnExcluir);
            if (icone) div.appendChild(icone);
            div.appendChild(nomeSpan);
            div.appendChild(botoesDiv);
            lista.appendChild(div);
          });
        }
      } catch (e) {
        lista.innerHTML = 'Erro ao carregar fichas.';
        console.error(e);
      }

      // Carrega fichas compartilhadas em paralelo
      carregarFichasCompartilhadas(uid);
    }

    // ── Fichas compartilhadas comigo ──────────────────────────────────────────

    async function carregarFichasCompartilhadas(uid) {
      const section = document.getElementById('fichas-compartilhadas-section');
      const lista = document.getElementById('lista-fichas-compartilhadas');

      try {
        const userSnap = await db.collection('users').doc(uid).get();
        if (!userSnap.exists) { section.style.display = 'none'; return; }

        const sharedIds = (userSnap.data().sharedSheetIds || []);
        if (sharedIds.length === 0) { section.style.display = 'none'; return; }

        section.style.display = 'block';
        lista.innerHTML = 'Carregando...';

        // Busca todos os docs em paralelo
        const snaps = await Promise.all(
          sharedIds.map(id => db.collection('sheets').doc(id).get())
        );

        lista.innerHTML = '';
        let found = false;

        snaps.forEach(snap => {
          if (!snap.exists) return; // ficha deletada
          found = true;
          const dados = snap.data();
          const sheetId = snap.id;

          // Resolve a permissão deste usuário nesta ficha
          const entry = (dados.sharedWith || []).find(s => s.uid === uid);
          const perm = entry
            ? entry.permission
            : (dados.isPublic ? (dados.publicPermission || 'read') : 'read');

          const div = document.createElement('div');
          div.className = 'ficha-row';

          const classeNomeS  = dados.data?.fields?.['classe-nome'] || '';
          const metalicoIdS  = dados.theme?.metalico || 'amarelo-escuro';
          const iconeS = criarIconeClasse(classeNomeS, metalicoIdS);

          const infoDiv = document.createElement('div');
          infoDiv.className = 'ficha-info';

          const nomeSpan = document.createElement('span');
          nomeSpan.textContent = dados.name || 'Sem nome';
          nomeSpan.className = 'ficha-nome ficha-nome-readonly';

          const ownerSpan = document.createElement('span');
          ownerSpan.textContent = '👤 ' + (dados.ownerEmail || dados.owner || '?');
          ownerSpan.className = 'ficha-owner-label';

          infoDiv.appendChild(nomeSpan);
          infoDiv.appendChild(ownerSpan);

          const botoesDiv = document.createElement('div');
          botoesDiv.className = 'ficha-botoes';

          const permBadge = document.createElement('span');
          permBadge.textContent = perm === 'edit' ? '✏' : '👁';
          permBadge.title = perm === 'edit' ? 'Permissão de edição' : 'Permissão de leitura';
          permBadge.className = 'ficha-perm-badge';

          const btnAbrir = document.createElement('button');
          btnAbrir.textContent = 'Abrir';
          btnAbrir.className = 'ficha-btn ficha-btn-abrir';
          btnAbrir.onclick = () => abrirFicha(sheetId);

          const btnRemover = document.createElement('button');
          btnRemover.textContent = 'Remover';
          btnRemover.title = 'Remover do meu dashboard';
          btnRemover.className = 'ficha-btn ficha-btn-remover';
          btnRemover.onclick = () => removerFichaCompartilhada(uid, sheetId);

          botoesDiv.appendChild(permBadge);
          botoesDiv.appendChild(btnAbrir);
          botoesDiv.appendChild(btnRemover);

          if (iconeS) div.appendChild(iconeS);
          div.appendChild(infoDiv);
          div.appendChild(botoesDiv);
          lista.appendChild(div);
        });

        if (!found) {
          lista.innerHTML = 'Nenhuma ficha compartilhada encontrada.';
        }
      } catch (e) {
        lista.innerHTML = 'Erro ao carregar fichas compartilhadas.';
        console.error(e);
      }
    }

    async function removerFichaCompartilhada(uid, sheetId) {
      if (!confirm('Remover esta ficha do seu dashboard?')) return;
      try {
        await db.collection('users').doc(uid).update({
          sharedSheetIds: firebase.firestore.FieldValue.arrayRemove(sheetId)
        });
        carregarFichasCompartilhadas(uid);
      } catch (e) { alert('Erro ao remover: ' + e.message); }
    }

    // ── CRUD de fichas ────────────────────────────────────────────────────────

    async function criarNovaFicha() {
      const nome = prompt('Nome do personagem:');
      if (!nome) return;
      const user = auth.currentUser;
      if (!user) return;
      try {
        await db.collection('sheets').add({
          owner: user.uid,
          ownerEmail: user.email,
          name: nome,
          data: { fields: { 'personagem-nome': nome } },
          isPublic: false,
          publicPermission: 'read',
          sharedWith: [],
          sharedUids: [],
          sharedUidsEdit: []
        });
        carregarDashboard(user.uid);
      } catch (e) { alert('Erro ao criar ficha: ' + e.message); }
    }

    async function editarNomeFicha(sheetId, nomeAtual) {
      const novoNome = prompt('Editar nome da ficha:', nomeAtual);
      if (novoNome === null || novoNome.trim() === '') return;
      try {
        await db.collection('sheets').doc(sheetId).update({ name: novoNome.trim() });
        carregarDashboard(auth.currentUser.uid);
      } catch (e) { alert('Erro ao renomear: ' + e.message); }
    }

    async function excluirFicha(sheetId, nome) {
      if (!confirm(`Excluir a ficha "${nome}"? Esta ação não pode ser desfeita.`)) return;
      try {
        await db.collection('sheets').doc(sheetId).delete();
        carregarDashboard(auth.currentUser.uid);
      } catch (e) { alert('Erro ao excluir: ' + e.message); }
    }

    function abrirFicha(id) {
      window.location.href = '/ficha.html?sheetId=' + id;
    }
  </script>
</body>
</html>
