<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <base href="/wiki/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documento — Wiki Odisseia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="css/wiki-main.css">
    <link rel="icon" type="image/x-icon" href="/image/odisseia-logo.ico">
</head>
<body>
    <div class="wiki-shell">

        <!-- Thin nav bar: back + actions -->
        <div class="wiki-topbar">
            <a href="/wiki" class="wiki-back-link">
                <span class="material-symbols-outlined" style="font-size:15px">arrow_back</span>
                Wiki
            </a>
            <div id="wiki-topbar-actions" class="wiki-topbar-actions"></div>
        </div>

        <!-- Rich identity header (dark leather, gold trim — mirrors ficha's sheet-header) -->
        <header class="wiki-doc-identity" id="wiki-doc-identity" style="display:none">
            <div class="wiki-doc-identity-body">
                <div class="wiki-doc-identity-crest" id="wiki-doc-identity-crest">
                    <span class="material-symbols-outlined">auto_stories</span>
                </div>
                <div class="wiki-doc-identity-text">
                    <div class="wiki-doc-identity-title" id="wiki-doc-identity-title">—</div>
                    <div class="wiki-doc-identity-sub"  id="wiki-doc-identity-sub"></div>
                </div>
            </div>
        </header>

        <!-- Parchment content area -->
        <div class="wiki-content">
            <div class="wiki-doc-wrap" id="wiki-doc-wrap">
                <div class="wiki-loading">Carregando...</div>
            </div>
        </div>

    </div>
    <div id="wiki-toast" class="wiki-toast"></div>
    <script type="module" src="js/wiki-doc.js"></script>
</body>
</html>
