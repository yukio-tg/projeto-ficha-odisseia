<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <base href="/wiki/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documento — Enciclopédia Ascalon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="css/wiki-main.css">
    <link rel="icon" type="image/x-icon" href="/image/odisseia-logo.ico">
</head>
<body>
<div class="wiki-shell">

    <!-- ══ HEADER ══ -->
    <header class="wiki-doc-header-bar" id="wiki-doc-header-bar">
        <div class="wiki-doc-header-bar-inner">
            <!-- Crest — click to return to encyclopedia -->
            <a href="/wiki" class="wiki-doc-crest wiki-doc-crest-link" id="wiki-doc-crest"
               title="Enciclopédia Ascalon">
                <div class="wiki-doc-crest-inner" id="wiki-doc-crest-inner">
                    <span class="material-symbols-outlined">auto_stories</span>
                </div>
            </a>
            <!-- Title block -->
            <div class="wiki-doc-header-text">
                <div class="wiki-doc-header-type" id="wiki-doc-header-type"></div>
                <h1 class="wiki-doc-header-title" id="wiki-doc-header-title">—</h1>
                <div class="wiki-doc-header-sub" id="wiki-doc-header-sub"></div>
            </div>
            <!-- Actions -->
            <div class="wiki-doc-header-actions">
                <div id="wiki-topbar-actions" class="wiki-topbar-actions"></div>
            </div>
        </div>
    </header>

    <!-- ══ BODY — sidebar + content ══ -->
    <div class="wiki-body">

        <!-- Sidebar -->
        <aside class="wiki-sidebar" id="wiki-sidebar">
            <div class="wiki-sidebar-inner">
                <div class="wiki-sidebar-search-wrap">
                    <span class="material-symbols-outlined wiki-sidebar-search-icon">search</span>
                    <input class="wiki-sidebar-search-input" id="wiki-sidebar-search"
                           type="text" placeholder="Buscar artigos…">
                </div>
                <div class="wiki-sidebar-list" id="wiki-sidebar-list">
                    <div class="wiki-sidebar-loading">Carregando…</div>
                </div>
            </div>
        </aside>

        <!-- Main area -->
        <div class="wiki-main-area">
            <div class="wiki-content">
                <div class="wiki-doc-wrap" id="wiki-doc-wrap">
                    <div class="wiki-loading">Carregando...</div>
                </div>
            </div>
        </div>

    </div><!-- /.wiki-body -->

</div><!-- /.wiki-shell -->

<div id="wiki-toast" class="wiki-toast"></div>
<script type="module" src="js/wiki-doc.js"></script>
</body>
</html>
