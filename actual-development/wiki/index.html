<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <!-- base: Firebase rewrite serves this file at URL /wiki (no slash),
         so without base, relative paths resolve to / instead of /wiki/. -->
    <base href="/wiki/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enciclopédia Ascalon</title>
    <link rel="icon" href="/image/odisseia-logo.ico">

    <!-- Google Fonts ─ typefaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <!-- Material Symbols Outlined (variable font) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <!-- Wiki CSS -->
    <link rel="stylesheet" href="css/wiki-main.css">
</head>
<body>

<div class="wiki-shell">

    <!-- ══════════════════════════════════════════════════════════════
         HEADER — dark leather bar
         ══════════════════════════════════════════════════════════════ -->
    <header class="wiki-header">
        <div class="wiki-header-row">

            <a href="/index.html" class="wiki-brand wiki-brand-home" title="Retornar para o dashboard">
                <span class="wiki-brand-logo" aria-hidden="true"></span>
                Enciclopédia Ascalon
            </a>

            <div class="wiki-header-actions">
                <a href="/wiki/criar" class="wiki-create-btn" id="wiki-create-btn"
                   style="display:none">
                    <span class="material-symbols-outlined" style="font-size:15px">add</span>
                    Novo Artigo
                </a>

                <div id="wiki-user-area"></div>
            </div>

        </div>
    </header>

    <!-- ══════════════════════════════════════════════════════════════
         BODY — sidebar + main area
         ══════════════════════════════════════════════════════════════ -->
    <div class="wiki-body">

        <!-- Sidebar -->
        <aside class="wiki-sidebar" id="wiki-sidebar">
            <div class="wiki-sidebar-inner">
                <div class="wiki-sidebar-search-wrap">
                    <span class="material-symbols-outlined wiki-sidebar-search-icon">search</span>
                    <input class="wiki-sidebar-search-input" id="wiki-search"
                           type="text" placeholder="Buscar artigos…">
                </div>
                <div class="wiki-sidebar-list" id="wiki-sidebar-list">
                    <div class="wiki-sidebar-loading">Carregando…</div>
                </div>
            </div>
        </aside>

        <!-- Main content area -->
        <div class="wiki-main-area">

            <!-- FILTER TABS -->
            <nav class="wiki-filter-nav">
                <button class="wiki-tab-btn active" data-type="">Todos</button>
                <button class="wiki-tab-btn" data-type="creature">Monstros</button>
                <button class="wiki-tab-btn" data-type="place">Lugares</button>
                <button class="wiki-tab-btn" data-type="person">Pessoas</button>
                <button class="wiki-tab-btn" data-type="concept">Conceitos</button>
                <button class="wiki-tab-btn" data-type="item">Itens</button>
                <button class="wiki-tab-btn" data-type="group">Grupos</button>
            </nav>

            <!-- MAIN CONTENT -->
            <main class="wiki-content" id="wiki-main">
                <div class="wiki-loading">Carregando documentos...</div>
            </main>

        </div><!-- /.wiki-main-area -->

    </div><!-- /.wiki-body -->

</div><!-- /.wiki-shell -->

<!-- Toast notification -->
<div id="wiki-toast" class="wiki-toast"></div>

<script type="module" src="js/wiki-list.js"></script>
</body>
</html>
