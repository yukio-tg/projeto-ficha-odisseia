<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Atributos — D20</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:        #c9a84c;
    --gold-light:  #e8d48a;
    --gold-dim:    #7a6130;
    --crimson:     #c0392b;
    --bg-deep:     #0a0805;
    --bg-card:     #110e08;
    --ink:         #d4c89a;
    --ink-dim:     #7a7060;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-deep);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(139,26,26,0.18)  0%, transparent 70%),
      radial-gradient(ellipse 60% 80% at 50% 100%,  rgba(201,168,76,0.08) 0%, transparent 70%),
      repeating-linear-gradient(0deg,  transparent, transparent 39px, rgba(201,168,76,0.03) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(201,168,76,0.03) 40px);
    font-family: 'IM Fell English', Georgia, serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem 3rem;
  }

  header { text-align: center; margin-bottom: 2rem; }
  header::before, header::after {
    content: '';
    display: block;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0.5rem auto;
    width: min(460px, 90vw);
  }
  .title-ornament {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    letter-spacing: 0.25em;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(201,168,76,0.6), 0 2px 8px #000;
    text-transform: uppercase;
  }
  .title-sub {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    color: var(--ink-dim);
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    margin-top: 0.3rem;
    letter-spacing: 0.1em;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    box-shadow: 0 0 0 1px #000, 0 0 40px rgba(201,168,76,0.08), inset 0 0 80px rgba(0,0,0,0.5);
    padding: 2.5rem 2rem 2rem;
    width: min(580px, 96vw);
    position: relative;
  }
  .card::before, .card::after, .card-corner-br, .card-corner-bl {
    content: ''; position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold-dim); border-style: solid;
  }
  .card::before   { top: 6px;    left: 6px;  border-width: 1px 0 0 1px; }
  .card::after    { top: 6px;    right: 6px; border-width: 1px 1px 0 0; }
  .card-corner-br { bottom: 6px; right: 6px; border-width: 0 1px 1px 0; }
  .card-corner-bl { bottom: 6px; left: 6px;  border-width: 0 0 1px 1px; }

  #radar-container {
    position: relative;
    width: 100%;
  }

  #radar-canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ── Attribute wrap (label + score input + modifier input) ── */
  .attr-wrap {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 5;
  }

  .attr-label {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.45rem, 1.2vw, 0.6rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(201,168,76,0.8), 0 1px 4px #000;
    white-space: nowrap;
    pointer-events: none;
  }

  .attr-input {
    pointer-events: all;
    width: clamp(34px, 7.5vw, 44px);
    height: clamp(34px, 7.5vw, 44px);
    background: rgba(10,8,5,0.92);
    border: 2px solid;
    border-radius: 50%;
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(0.72rem, 1.7vw, 0.92rem);
    font-weight: 700;
    text-align: center;
    outline: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.4), inset 0 0 8px rgba(0,0,0,0.7);
    transition: border-color 0.2s, box-shadow 0.2s;
    -moz-appearance: textfield; appearance: textfield;
  }
  .attr-input::-webkit-inner-spin-button,
  .attr-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .attr-input:focus {
    box-shadow: 0 0 0 2px var(--glow-color, rgba(201,168,76,0.3)), 0 0 14px var(--glow-color, rgba(201,168,76,0.4)), inset 0 0 8px rgba(0,0,0,0.7);
  }

  /* Modifier input – smaller, diamond shape */
  .mod-wrap {
    pointer-events: all;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .mod-label {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.38rem, 0.9vw, 0.48rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(180,160,100,0.55);
    pointer-events: none;
    white-space: nowrap;
  }
  .mod-input {
    pointer-events: all;
    width: clamp(28px, 5vw, 36px);
    height: clamp(16px, 3vw, 20px);
    background: rgba(10,8,5,0.85);
    border: 1px solid;
    border-radius: 3px;
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(0.48rem, 1.1vw, 0.6rem);
    font-weight: 700;
    text-align: center;
    outline: none;
    box-shadow: 0 0 6px rgba(0,0,0,0.5), inset 0 0 4px rgba(0,0,0,0.6);
    transition: border-color 0.2s, box-shadow 0.2s;
    -moz-appearance: textfield; appearance: textfield;
    cursor: pointer;
    padding: 0;
  }
  .mod-input::-webkit-inner-spin-button,
  .mod-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .mod-input:focus {
    box-shadow: 0 0 0 1px var(--glow-color, rgba(201,168,76,0.3)), 0 0 8px var(--glow-color, rgba(201,168,76,0.3)), inset 0 0 4px rgba(0,0,0,0.6);
  }

  /* ── Central hexagonal level input ── */
  #level-center {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .hex-shell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
  }
  .hex-svg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }
  #level-label {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.38rem, 1vw, 0.52rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(201,168,76,0.65);
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    white-space: nowrap;
  }
  #level-input {
    pointer-events: all;
    background: transparent;
    border: none;
    color: var(--gold-light);
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    font-weight: 700;
    text-align: center;
    outline: none;
    width: 100%;
    text-shadow: 0 0 14px rgba(201,168,76,0.7), 0 2px 6px #000;
    -moz-appearance: textfield; appearance: textfield;
    position: relative;
    z-index: 2;
    padding-bottom: 8%;
  }
  #level-input::-webkit-inner-spin-button,
  #level-input::-webkit-outer-spin-button { -webkit-appearance: none; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    margin: 1.4rem 0 0;
  }
  .total-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0 0;
  }
  .total-label {
    font-family: 'Cinzel', serif; font-size: 0.7rem;
    color: var(--ink-dim); letter-spacing: 0.12em; text-transform: uppercase;
  }
  .total-value {
    font-family: 'Cinzel Decorative', serif; font-size: 1rem;
    color: var(--gold-light); text-shadow: 0 0 10px rgba(201,168,76,0.5);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="title-ornament">Ficha de Atributos</div>
  <div class="title-sub">Sistema D20 · Atributos do Personagem</div>
</header>

<div class="card">
  <div class="card-corner-br"></div>
  <div class="card-corner-bl"></div>

  <div id="radar-container">
    <canvas id="radar-canvas"></canvas>
    <!-- Level hex injected by JS -->
  </div>

  <div class="divider"></div>
  <div class="total-row">
    <span class="total-label">Total de Pontos</span>
    <span class="total-value" id="total-pts">—</span>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const ATTRS = [
  { abbr: 'FOR', color: '#c0392b' },
  { abbr: 'DES', color: '#3b82f6' },
  { abbr: 'CAR', color: '#a855f7' },
  { abbr: 'SAB', color: '#10b981' },
  { abbr: 'INT', color: '#eab308' },
  { abbr: 'CON', color: '#f97316' },
];
const N            = ATTRS.length;
const MAX          = 20;
const TICKS        = 4;
const PADDING      = 76;
const INPUT_OFFSET = 42;

let values    = [15, 13, 8, 12, 10, 14];
let modValues = [2,  1, -1,  1,  0,  2];  // pre-filled modifier values

function calcMod(v) { return Math.floor((v - 10) / 2); }

/* ============================================================
   CANVAS
   ============================================================ */
const container = document.getElementById('radar-container');
const canvas    = document.getElementById('radar-canvas');
const ctx       = canvas.getContext('2d');
const DPR       = window.devicePixelRatio || 1;

let cssVertices = [];
let centerCSS   = { x: 0, y: 0 };
let outerR_CSS  = 0;

function resize() {
  const side = container.clientWidth;
  canvas.style.width  = side + 'px';
  canvas.style.height = side + 'px';
  canvas.width  = Math.round(side * DPR);
  canvas.height = Math.round(side * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}

function angleOf(i) { return -Math.PI / 2 + (2 * Math.PI / N) * i; }

function vertex(cx, cy, r, i) {
  const a = angleOf(i);
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), angle: a };
}

/* ============================================================
   DRAW
   ============================================================ */
function draw() {
  const W  = canvas.width  / DPR;
  const H  = canvas.height / DPR;
  const cx = W / 2;
  const cy = H / 2;
  const R  = Math.min(W, H) / 2 - PADDING;

  ctx.clearRect(0, 0, W, H);

  /* Rings */
  for (let t = 1; t <= TICKS; t++) {
    const r = R * t / TICKS;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const v = vertex(cx, cy, r, i);
      i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
    }
    ctx.closePath();
    if (t % 2 === 0) { ctx.fillStyle = 'rgba(201,168,76,0.03)'; ctx.fill(); }
    ctx.strokeStyle = t === TICKS ? 'rgba(201,168,76,0.30)' : 'rgba(201,168,76,0.11)';
    ctx.lineWidth   = t === TICKS ? 1.5 : 1;
    ctx.stroke();
  }

  /* Spokes */
  for (let i = 0; i < N; i++) {
    const v = vertex(cx, cy, R, i);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(v.x, v.y);
    ctx.strokeStyle = ATTRS[i].color;
    ctx.lineWidth   = 1.3;
    ctx.stroke();
  }

  /* Ring labels */
  ctx.font         = '10px "Cinzel", serif';
  ctx.fillStyle    = 'rgba(90,80,60,0.85)';
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'middle';
  for (let t = 1; t < TICKS; t++) {
    const r  = R * t / TICKS;
    ctx.fillText(t * (MAX / TICKS), cx + 5, cy - r);
  }

  /* Data polygon */
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const r = R * values[i] / MAX;
    const v = vertex(cx, cy, r, i);
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  ctx.fillStyle   = 'rgba(192,57,43,0.18)';
  ctx.fill();
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth   = 2;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  /* Markers */
  for (let i = 0; i < N; i++) {
    const r = R * values[i] / MAX;
    const v = vertex(cx, cy, r, i);
    ctx.beginPath();
    ctx.arc(v.x, v.y, 4.8, 0, Math.PI * 2);
    ctx.fillStyle   = ATTRS[i].color;
    ctx.fill();
    ctx.strokeStyle = '#ffffff22';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  }

  /* Store layout values for DOM placement */
  cssVertices = [];
  for (let i = 0; i < N; i++) cssVertices.push(vertex(cx, cy, R, i));
  centerCSS = { x: cx, y: cy };
  outerR_CSS = R;

  placeInputs();
  placeLevelHex();
}

/* ============================================================
   ATTRIBUTE INPUTS (score + modifier)
   ============================================================ */
const inputWraps = [];

ATTRS.forEach((attr, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'attr-wrap';

  const lbl = document.createElement('span');
  lbl.className   = 'attr-label';
  lbl.textContent = attr.abbr;
  lbl.style.color = attr.color;

  /* Score input */
  const inp = document.createElement('input');
  inp.type      = 'number';
  inp.className = 'attr-input';
  inp.min = 0; inp.max = MAX;
  inp.value = values[i];
  inp.style.borderColor = attr.color;
  inp.style.setProperty('--glow-color', attr.color + '66');

  inp.addEventListener('input', () => {
    let v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    if (v > MAX) v = MAX;
    values[i] = v;
    /* auto-sync modifier */
    modValues[i] = calcMod(v);
    modInp.value = modValues[i] >= 0 ? '+' + modValues[i] : modValues[i];
    draw();
    updateTotal();
  });
  inp.addEventListener('blur', () => { inp.value = values[i]; });

  /* Modifier wrap */
  const modWrap = document.createElement('div');
  modWrap.className = 'mod-wrap';

  const modLbl = document.createElement('span');
  modLbl.className   = 'mod-label';
  modLbl.textContent = 'mod';
  modLbl.style.color = attr.color + 'aa';

  const modInp = document.createElement('input');
  modInp.type      = 'text';   // text so we can show "+" prefix
  modInp.className = 'mod-input';
  modInp.value     = modValues[i] >= 0 ? '+' + modValues[i] : modValues[i];
  modInp.style.borderColor = attr.color + 'cc';
  modInp.style.setProperty('--glow-color', attr.color + '44');
  modInp.title = 'Modificador (editável)';

  modInp.addEventListener('focus', () => {
    // show raw number for editing
    modInp.value = modValues[i];
  });
  modInp.addEventListener('input', () => {
    const raw = parseInt(modInp.value, 10);
    if (!isNaN(raw)) modValues[i] = raw;
  });
  modInp.addEventListener('blur', () => {
    modInp.value = modValues[i] >= 0 ? '+' + modValues[i] : modValues[i];
  });

  modWrap.appendChild(modLbl);
  modWrap.appendChild(modInp);

  wrap.appendChild(lbl);
  wrap.appendChild(inp);
  wrap.appendChild(modWrap);
  container.appendChild(wrap);
  inputWraps.push({ wrap, modInp });
});

function placeInputs() {
  for (let i = 0; i < N; i++) {
    const { x, y, angle } = cssVertices[i];
    const fx = x + INPUT_OFFSET * Math.cos(angle);
    const fy = y + INPUT_OFFSET * Math.sin(angle);

    const { wrap } = inputWraps[i];
    wrap.style.left = fx + 'px';
    wrap.style.top  = fy + 'px';

    const sin = Math.sin(angle);
    wrap.style.flexDirection = sin > 0.1 ? 'column' : 'column-reverse';
  }
}

/* ============================================================
   HEXAGONAL LEVEL INPUT (center)
   ============================================================ */
let levelEl    = null;
let hexSvgEl   = null;
let levelInput = null;
let levelVal   = 1;

function buildHexEl() {
  levelEl = document.createElement('div');
  levelEl.id = 'level-center';

  const shell = document.createElement('div');
  shell.className = 'hex-shell';

  /* SVG hexagon drawn by JS below in placeLevelHex */
  hexSvgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  hexSvgEl.classList.add('hex-svg');

  const inp = document.createElement('input');
  inp.type      = 'number';
  inp.id        = 'level-input';
  inp.min       = 1; inp.max = 20;
  inp.value     = levelVal;
  inp.setAttribute('aria-label', 'Nível do personagem');

  inp.addEventListener('input', () => {
    let v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 20) v = 20;
    levelVal = v;
    updateHexGlow();
  });
  inp.addEventListener('blur', () => { inp.value = levelVal; });

  const lbl = document.createElement('span');
  lbl.id = 'level-label';
  lbl.textContent = 'nível';

  shell.appendChild(hexSvgEl);
  shell.appendChild(inp);
  shell.appendChild(lbl);
  levelEl.appendChild(shell);
  container.appendChild(levelEl);

  levelInput = inp;
}

function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (Math.PI / 3) * i;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}

function updateHexGlow() {
  if (!hexSvgEl) return;
  const t   = (levelVal - 1) / 19;           // 0..1
  const r   = Math.round(192 + t * 63);      // crimson → gold-ish
  const g   = Math.round(57  + t * 111);
  const b   = Math.round(43  + t * 9);
  const hex = '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
  const outer = hexSvgEl.querySelector('#hex-outer');
  const inner = hexSvgEl.querySelector('#hex-inner');
  if (outer) outer.setAttribute('stroke', hex);
  if (inner) inner.setAttribute('stroke', hex + '55');
  const glow  = hexSvgEl.querySelector('#hex-glow');
  if (glow) { glow.setAttribute('stdDeviation', 4 + t * 6); }
}

function placeLevelHex() {
  if (!levelEl) buildHexEl();

  /* Size: ~18% of outerR */
  const size = Math.max(32, outerR_CSS * 0.20);
  const dim  = size * 2 + 12;

  const shell = levelEl.querySelector('.hex-shell');
  shell.style.width  = dim + 'px';
  shell.style.height = dim + 'px';

  /* Position */
  levelEl.style.left = centerCSS.x + 'px';
  levelEl.style.top  = centerCSS.y + 'px';

  /* Rebuild SVG */
  const svgNS = 'http://www.w3.org/2000/svg';
  while (hexSvgEl.firstChild) hexSvgEl.removeChild(hexSvgEl.firstChild);
  hexSvgEl.setAttribute('width',  dim);
  hexSvgEl.setAttribute('height', dim);
  hexSvgEl.setAttribute('viewBox', `0 0 ${dim} ${dim}`);
  hexSvgEl.style.width  = dim + 'px';
  hexSvgEl.style.height = dim + 'px';

  const hcx = dim / 2, hcy = dim / 2;

  /* glow filter */
  const defs   = document.createElementNS(svgNS, 'defs');
  const filter = document.createElementNS(svgNS, 'filter');
  filter.setAttribute('id', 'hglow');
  const fe = document.createElementNS(svgNS, 'feGaussianBlur');
  fe.setAttribute('id', 'hex-glow');
  fe.setAttribute('stdDeviation', '6');
  fe.setAttribute('result', 'blur');
  filter.appendChild(fe);
  const feMerge = document.createElementNS(svgNS, 'feMerge');
  ['blur','SourceGraphic'].forEach(ref => {
    const n = document.createElementNS(svgNS, 'feMergeNode');
    n.setAttribute('in', ref);
    feMerge.appendChild(n);
  });
  filter.appendChild(feMerge);
  defs.appendChild(filter);
  hexSvgEl.appendChild(defs);

  /* bg fill */
  const bg = document.createElementNS(svgNS, 'polygon');
  bg.setAttribute('points', hexPoints(hcx, hcy, size).map(p => p.join(',')).join(' '));
  bg.setAttribute('fill', 'rgba(10,8,5,0.92)');
  hexSvgEl.appendChild(bg);

  /* inner hex (decorative) */
  const inner = document.createElementNS(svgNS, 'polygon');
  inner.setAttribute('id', 'hex-inner');
  inner.setAttribute('points', hexPoints(hcx, hcy, size * 0.72).map(p => p.join(',')).join(' '));
  inner.setAttribute('fill', 'none');
  inner.setAttribute('stroke', '#c0392b55');
  inner.setAttribute('stroke-width', '0.8');
  hexSvgEl.appendChild(inner);

  /* outer hex */
  const outer = document.createElementNS(svgNS, 'polygon');
  outer.setAttribute('id', 'hex-outer');
  outer.setAttribute('points', hexPoints(hcx, hcy, size).map(p => p.join(',')).join(' '));
  outer.setAttribute('fill', 'none');
  outer.setAttribute('stroke', '#c0392b');
  outer.setAttribute('stroke-width', '2');
  outer.setAttribute('filter', 'url(#hglow)');
  hexSvgEl.appendChild(outer);

  /* corner ornaments */
  hexPoints(hcx, hcy, size).forEach(([px, py]) => {
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    dot.setAttribute('r', '2.2');
    dot.setAttribute('fill', '#c9a84c');
    dot.setAttribute('opacity', '0.7');
    hexSvgEl.appendChild(dot);
  });

  /* input sizing */
  levelInput.style.fontSize = Math.max(14, size * 0.72) + 'px';
  levelInput.style.width    = dim + 'px';

  updateHexGlow();
}

/* ============================================================
   TOTAL
   ============================================================ */
function updateTotal() {
  const t = values.reduce((a, b) => a + b, 0);
  document.getElementById('total-pts').textContent = `${t} / ${N * MAX}`;
}
updateTotal();

/* ============================================================
   RESPONSIVE
   ============================================================ */
new ResizeObserver(() => resize()).observe(container);
resize();
</script>
</body>
</html>
