<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FichaDesign Teste</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html{
            background-color: black;
            height: 100%;
        }

        .background{
            background-color: black;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .content{
            display: flex;
        }

        .sheet{
            background-color: gainsboro;
            width: 600px;
            height: 100%;
        }

        .tab-col{
            margin-top: 100px;
            width: 80px;
            height: 100%;
        }
        
        .tab-col ul{
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tab-col ul li{
            margin-left: 10px;
            list-style: none;
            padding: 10px;
            background-color: rgb(156, 156, 156);
            transition: all .2s;
            width: 100px;
            border-radius: 5px;
        }

        .tab-col ul li:hover{
            margin-left: 5px;
            background-color: #ff9898;
        }

        .tab-col ul li.active{
            margin-left: 0;
            background-color: gainsboro;
        }

        .sheet header{
            background-color: #2c2c2c;
            color: #ffc400;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 10px black;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="content">
            <aside class="tab-col">
                <ul>
                    <li class="active">Geral</li>
                    <li>Perícias</li>
                    <li>Combate</li>
                    <li>Habilidades</li>
                    <li>Magias</li>
                    <li>Inventário</li>
                    <li>Besta</li>
                    <li>Anotações</li>
                </ul>
            </aside>
            <main class="sheet">
                <header>
                    <h1>Odisseia Título</h1>
                </header>
            </main>
        </div>
    </div>
</body>
</html>
