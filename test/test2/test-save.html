<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta nome="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando salvamento e permanência de dados</title>
    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <label>autocalc? <input type="checkbox" data-field="autocalc" checked></label>

    <div style="margin-bottom: 15px;" id="retrato-area">
        <img id="retrato-img" src="" alt="Retrato"
            style="max-width: 150px; display: none; border: 1px solid #ccc; margin-bottom: 5px;">
        <div id="retrato-inputs">
            <input type="text" id="retrato-url" data-field="retrato-url" placeholder="URL da imagem"
                style="width: 200px;">
            <span> ou </span>
            <input type="file" id="retrato-file" accept="image/*">
        </div>
        <button type="button" id="limpar-retrato" style="display: none;">Remover</button>
    </div>

    <h2>Ficha de Personagem (Simplificada para testes)</h2>

    <label>Nome: <input type="text" data-field="nome" value=""></label><br>
    <label>Nível: <input id="level" type="number" data-field="level" value=""></label><br>
    <label>Herança:
        <select data-field="heranca">
            <option value="homemDaMata">Homem da Mata</option>
            <option value="carcereiro">Carcereiro</option>
            <option value="sangueReal">Sangue Real</option>
        </select>
        <label>Aumento de Fortuna<input type="checkbox" data-field="aumentoDeFortuna"></label>
        <label>Aprendizado de Vida<input type="checkbox" data-field="aprendizadoDaVida"></label>
        <label>Habilidade Adquirida<input type="checkbox" data-field="habilidadeAdquirida"></label>
    </label><br>
    <div id="aprendizado-escolha-container" style="display: none;">
        <p><small><em id="aprendizado-nota"></em></small></p>
        <label>Escolha o atributo:
            <select data-field="aprendizadoEscolha"></select>
        </label>
    </div>
    <label>Fortuna:
        <select data-field="hierarquia">
            <option value="pobre">Pobre</option>
            <option value="trabalhador">Trabalhador</option>
            <option value="vendedor">Vendedor</option>
            <option value="burgues">Burguês</option>
            <option value="barao">Barão</option>
            <option value="duque">Duque</option>
            <option value="herdeiro">Herdeiro</option>
            <option value="imperador">Imperador</option>
        </select>
        <input type="number" data-field="dinheiro">
    </label><br>
    <div id="individualidadeNome" style="display: none;">
        <label>Individualidade: <input type="text" data-field="individualidadeNome" value=""></label>
    </div>
    <label>Classe:
        <select data-field="classe">
            <option value="coracao">Coracão</option>
            <option value="arcanista">Arcanista</option>
            <option value="certeiro">Certeiro</option>
        </select>
    </label><br>
    <div id="ramos-container" style="display:none">
        <label>Ramos:
            <select data-field="ramos">
            </select>
        </label><br><br>
    </div>

    <h2>Vitais</h2>
    <div class="vitais">

        <label>PV:
            <input id="pv-atual" type="number" data-field="pv-atual" placeholder="Atual" style="width:60px"> /
            <input id="pv-max" type="number" data-field="pv-max" placeholder="Máx" style="width:60px">
        </label><span id="pv-alerta" style="color:red; display:none;"> PV atual excede o máximo!</span><br>

        <label>PM:
            <input id="pm-atual" type="number" data-field="pm-atual" placeholder="Atual" style="width:60px"> /
            <input id="pm-max" type="number" data-field="pm-max" placeholder="Máx" style="width:60px">
        </label><span id="pm-alerta" style="color:red; display:none;"> PM atual excede o máximo!</span><br>

        <label>PT:
            <input id="pt-atual" type="number" data-field="pt-atual" placeholder="Atual" style="width:60px" readonly> /
            <input id="pt-max" type="number" data-field="pt-max" placeholder="Máx" style="width:60px" readonly>
        </label><span id="pt-alerta" style="color:red; display:none;"> PT atual excede o máximo!</span><br>

        <label>DEF: <input id="def" type="number" data-field="def" value=""></label><br>
        <label>INV:
            <input id="inv-atual" type="number" data-field="inv-atual" placeholder="Atual" style="width:60px"> /
            <input id="inv-max" type="number" data-field="inv-max" placeholder="Máx" style="width:60px">
        </label><span id="inv-alerta" style="color:red; display:none;"> INV atual excede o máximo!</span><br>

        <label>LA:
            <input id="la-atual" type="number" data-field="la-atual" placeholder="Atual" style="width:60px"> /
            <input id="la-max" type="number" data-field="la-max" placeholder="Máx" style="width:60px">
        </label><span id="la-alerta" style="color:red; display:none;"> LA atual excede o máximo!</span><br>
    </div>


    <h2>Atributos</h2>

    <label>Constituição: <input id="constituicao" type="number" data-field="constituicao" value=""></label><br>
    <label>Destreza: <input id="destreza" type="number" data-field="destreza" value=""></label><br>
    <label>Força: <input id="forca" type="number" data-field="forca" value=""></label><br>
    <label>Carisma: <input id="carisma" type="number" data-field="carisma" value=""></label><br>
    <label>Inteligência: <input id="inteligencia" type="number" data-field="inteligencia" value=""></label><br>
    <label>Sabedoria: <input id="sabedoria" type="number" data-field="sabedoria" value=""></label><br>

    <h2>Poderes</h2>
    <button type="button" id="add-poder-btn">Adicionar Poder</button>
    <div id="poderes-container">
        <!-- As linhas serão geradas via JavaScript -->
    </div>
    <datalist id="poderes-sugestoes"></datalist>

    <h3>Output</h3>
    <div style="margin: 15px 0;">
        <button type="button" id="save-btn">💾 Salvar Ficha (JSON)</button>
        <button type="button" id="load-btn">📂 Carregar Ficha (JSON)</button>
        <input type="file" id="load-file-input" accept=".json" style="display:none;">
    </div>
    <pre id="output"></pre>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD0GKHekJIBroBaQbbKIagcaZ52ljsgT6A",
            authDomain: "fichas-odisseia.firebaseapp.com",
            projectId: "fichas-odisseia",
            storageBucket: "fichas-odisseia.firebasestorage.app",
            messagingSenderId: "438632062292",
            appId: "1:438632062292:web:68e9584cf8f5ffcf2e3cc1",
            measurementId: "G-JRFYC354YB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>
    <script>
        // Get sheet ID from URL (e.g., ?sheetId=ABC123)
        const urlParams = new URLSearchParams(window.location.search);
        const sheetId = urlParams.get('sheetId') || 'test-sheet-default'; // fallback for testing

        // The current user (will be set once Firebase auth ready)
        let currentUser = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                console.log('Logado como', user.email);
                // Once we have user + sheetId, we can load initial data from Firestore
                carregarDadosDaNuvem();
            } else {
                currentUser = null;
                alert('Você precisa estar logado.');
                // Optionally redirect to login
            }
        });

        async function carregarDadosDaNuvem() {
            if (!currentUser || !sheetId) return;
            try {
                const doc = await db.collection('sheets').doc(sheetId).get();
                if (doc.exists && doc.data().data) {
                    fillSheetData(doc.data().data);   // the "data" field contains the full sheet object
                } else {
                    // No cloud save yet – use whatever defaults the page already has,
                    // and optionally push an initial save.
                    console.log('Nenhum dado salvo na nuvem, usando padrões locais.');
                    autoSaveToFirebase(); // save the initial state
                }
            } catch (e) {
                console.error('Erro ao carregar da nuvem:', e);
            }
        }

        let isLoading = false;

        // ADICONA IAMGEM
        const retratoImg = document.getElementById('retrato-img');
        const retratoUrlInput = document.getElementById('retrato-url');
        const retratoFileInput = document.getElementById('retrato-file');
        const limparRetratoBtn = document.getElementById('limpar-retrato');
        const retratoInputs = document.getElementById('retrato-inputs');

        function mostrarInputs(mostrar) {
            if (mostrar) {
                retratoInputs.style.display = '';
                limparRetratoBtn.style.display = 'none';
            } else {
                retratoInputs.style.display = 'none';
                limparRetratoBtn.style.display = '';
            }
        }

        function atualizarRetrato(url) {
            if (url) {
                retratoImg.src = url;
                retratoImg.style.display = '';
                retratoUrlInput.value = url;  // mantém o campo atualizado para gravação futura
                mostrarInputs(false);         // esconde os inputs, mostra o botão Remover
            } else {
                retratoImg.src = '';
                retratoImg.style.display = 'none';
                retratoUrlInput.value = '';
                retratoFileInput.value = '';  // limpa a seleção de arquivo
                mostrarInputs(true);          // mostra os inputs novamente
            }
        }

        // URL digitada manualmente
        retratoUrlInput.addEventListener('input', function () {
            const url = this.value.trim();
            if (url) {
                atualizarRetrato(url);
            } else {
                atualizarRetrato('');  // se apagar o texto, volta aos inputs
            }
        });

        // Arquivo local
        retratoFileInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    atualizarRetrato(e.target.result);
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // Botão Remover
        limparRetratoBtn.addEventListener('click', function () {
            atualizarRetrato('');
        });

        // HERANÇA PREENCHE AUTOMATICAMENTE A FORTUNA
        const hierarquiaOrdem = [
            'pobre',
            'trabalhador',
            'vendedor',
            'burgues',
            'barao',
            'duque',
            'herdeiro',
            'imperador'
        ]

        const herancaFortunas = {
            homemDaMata: { hierarquia: 'pobre', dinheiro: 0 },
            carcereiro: { hierarquia: 'trabalhador', dinheiro: 50 },
            sangueReal: { hierarquia: 'vendedor', dinheiro: 300 },
        };

        const herancaHabilidades = {
            homemDaMata: "Primitivo",   // Exato nome no poderes.json
            carcereiro: "Enjaular",
            sangueReal: "Podre de Rico"
        };

        const bonusCheckboxes = [
            document.querySelector('[data-field="aumentoDeFortuna"]'),
            document.querySelector('[data-field="aprendizadoDaVida"]'),
            document.querySelector('[data-field="habilidadeAdquirida"]')
        ];

        function limitarCheckboxes() {
            const marcadas = bonusCheckboxes.filter(cb => cb.checked);
            if (marcadas.length > 2) {
                if (this && marcadas.includes(this)) {
                    this.checked = false;
                }
            }
        }

        bonusCheckboxes.forEach(cb => {
            cb.addEventListener('change', function () {
                const level = parseInt(document.getElementById('level').value, 10) || 0;

                if (level >= 12) {
                    bonusCheckboxes.forEach(c => c.checked = true);
                } else {
                    limitarCheckboxes.call(this);
                }
                updateAprendizadoChoice();
                updateFortuna();
                calcStats();
            });
        });

        const aprendizadoEscolhaNotas = {
            carcereiro: 'Para Carcereiro com Aprendizado da Vida: escolha entre +1 em Força ou Destreza.',
        };

        const aprendizadoBonus = {
            homemDaMata: { automatico: { constituicao: 2 } },
            sangueReal: { automatico: { carisma: 1 } },
            carcereiro: { escolha: ['forca', 'destreza'] }
        };

        function updateAprendizadoChoice() {
            const container = document.getElementById('aprendizado-escolha-container');
            const notaEl = document.getElementById('aprendizado-nota');
            const selectEl = document.querySelector('[data-field="aprendizadoEscolha"]')

            const heranca = document.querySelector('[data-field="heranca"]').value;
            const aprendizadoCheck = document.querySelector('[data-field="aprendizadoDaVida"]');
            const ativo = aprendizadoCheck && aprendizadoCheck.checked;


            const bonusConfig = aprendizadoBonus[heranca];

            if (ativo && bonusConfig && bonusConfig.escolha) {
                container.style.display = '';

                notaEl.textContent = aprendizadoEscolhaNotas[heranca] || `Escolha o bônus de aprendizado para ${heranca}:`;

                selectEl.innerHTML = '';
                bonusConfig.escolha.forEach(attr => {
                    const option = document.createElement('option');
                    option.value = attr;

                    option.textContent = attr.charAt(0).toUpperCase() + attr.slice(1) + ' (+1)';
                    selectEl.appendChild(option);
                });
            } else {
                container.style.display = 'none';
                selectEl.innerHTML = '';
            }
        };

        const bonusAttrs = {
            constituicao: 0,
            destreza: 0,
            forca: 0,
            carisma: 0,
            inteligencia: 0,
            sabedoria: 0
        }

        function computeBonusAttrs() {
            const newBonus = { ...bonusAttrs };

            for (let attr in newBonus) newBonus[attr] = 0;

            const heranca = document.querySelector('[data-field="heranca"]').value;
            const aprendizadoCheck = document.querySelector('[data-field="aprendizadoDaVida"]');

            if (!aprendizadoCheck || !aprendizadoCheck.checked) return newBonus;

            const config = aprendizadoBonus[heranca];
            if (!config) return newBonus;

            if (config.automatico) {
                for (let attr in config.automatico) {
                    if (newBonus[attr] !== undefined) {
                        newBonus[attr] += config.automatico[attr];
                    }
                }
            } else if (config.escolha) {
                const escolhaSelect = document.querySelector('[data-field="aprendizadoEscolha"]')
                if (escolhaSelect && escolhaSelect.value) {
                    const attr = escolhaSelect.value;
                    if (newBonus[attr] !== undefined) {
                        newBonus[attr] += 1;
                    }
                }
            }
            return newBonus
        }

        function updateBonusAttrs() {
            const newBonus = computeBonusAttrs();
            attrIds.forEach(attr => { bonusAttrs[attr] = newBonus[attr]; });
        }

        function updateFortuna() {
            const heranca = document.querySelector('[data-field="heranca"]').value;
            const base = herancaFortunas[heranca] || { hierarquia: 'pobre', dinheiro: 0 };
            const level = parseInt(document.getElementById('level').value, 10) || 0;

            let indiceBase = hierarquiaOrdem.indexOf(base.hierarquia)
            if (indiceBase === -1) indiceBase = 0;

            let aumento = 0;
            if (level >= 5) aumento++;
            if (level >= 13) aumento++;
            if (level >= 19) aumento++;

            // Bônus da checkbox deve vir antes do cálculo
            const fortunaCheck = document.querySelector('[data-field="aumentoDeFortuna"]');
            if (fortunaCheck && fortunaCheck.checked) aumento++;

            const indiceFinal = Math.min(indiceBase + aumento, hierarquiaOrdem.length - 1);
            const novaHierarquia = hierarquiaOrdem[indiceFinal]

            document.querySelector('[data-field="hierarquia"]').value = novaHierarquia;
            document.querySelector('[data-field="dinheiro"]').value = base.dinheiro;
        }

        function enforceNivel12Checkboxes() {
            const level = parseInt(document.getElementById('level').value, 10) || 0;
            if (level >= 12) {
                bonusCheckboxes.forEach(cb => { cb.checked = true; });
            } else {
                if (bonusCheckboxes.every(cb => cb.checked)) {
                    const habilidade = document.querySelector('[data-field="habilidadeAdquirida"]');
                    if (habilidade) habilidade.checked = false;
                }
            }
        }

        // APARIÇÃO DOS RAMOS DE ACORDO COM A CLASSE E NÍVEL
        function updateHiddenByLevel() {
            const ramoContainer = document.getElementById('ramos-container')
            const individualidadenomeContainer = document.getElementById('individualidadeNome')
            const level = parseInt(document.getElementById('level').value, 10) || 0;

            if (level >= 2) {
                ramoContainer.style.display = '';

                // APARIÇÃO DAS INDIVIDUALIDADES DE ACORDO COM O NÍVEL
                individualidadenomeContainer.style.display = level >= 3 ? '' : 'none';
            } else {
                ramoContainer.style.display = 'none';
            }

        }

        const classeRamos = {
            coracao: [
                { value: 'abencoado', text: 'Abençoado' },
                { value: 'altruista', text: 'Altruísta' },
                { value: 'prudente', text: 'Prudente' }
            ],
            arcanista: [
                { value: 'daCriacao', text: 'da Criação' },
                { value: 'raiz', text: 'Raiz' },
                { value: 'ludico', text: 'Lúdico' }
            ],
            certeiro: [
                { value: 'maoAmpla', text: 'Mão Ampla' },
                { value: 'maoDupla', text: 'Mão Dupla' },
                { value: 'maoNula', text: 'Mão Nula' }
            ],
        }

        function updateRamos() {
            const classeSelect = document.querySelector('[data-field="classe"]');
            const ramoSelect = document.querySelector('[data-field="ramos"]');
            const selectedclasse = classeSelect.value;

            ramoSelect.innerHTML = '';

            const ramos = classeRamos[selectedclasse] || [];

            ramos.forEach(ramo => {
                const option = document.createElement('option');
                option.value = ramo.value;
                option.textContent = ramo.text;
                ramoSelect.appendChild(option);
            })
        }


        //CALCULO AUTOMATICO DE ATRIBUTOS

        const statFormulas = {
            'pv-max': {
                coracao: (a, lvl) => 23 + a.constituicao + lvl * (4 + a.constituicao / 2),
                arcanista: (a, lvl) => 13 + a.constituicao + lvl * (2 + a.constituicao / 2),
                certeiro: (a, lvl) => 13 + a.constituicao + lvl * (2 + a.constituicao / 2),
            },
            'pm-max': {
                coracao: (a, lvl) => 2 + a.carisma + lvl * (1 + a.carisma / 2),
                arcanista: (a, lvl) => 8 + a.carisma + lvl * (3 + a.carisma / 2),
                certeiro: (a, lvl) => 5 + a.carisma + lvl * (2 + a.carisma / 2),
            },
            'pt-max': {
                coracao: (a, lvl) => 2 + a.inteligencia + lvl * (1 + a.inteligencia / 2),
                arcanista: (a, lvl) => 6 + a.inteligencia + lvl * (3 + a.inteligencia / 2),
                certeiro: (a, lvl) => 6 + a.inteligencia + lvl * (3 + a.inteligencia / 2),
            },
            'la-max': {
                coracao: (a) => a.sabedoria,
                arcanista: (a, lvl) => 3 + a.sabedoria + lvl * (2 + a.sabedoria / 2),
                certeiro: (a, lvl) => a.sabedoria + lvl * (a.sabedoria / 2),
            },
            'inv-max': {
                coracao: (a) => 7 + a.forca,
                arcanista: (a) => 2 + a.forca,
                certeiro: (a) => 2 + a.forca
            },
            'def': {
                default: (a) => 10 + a.destreza
            },
        };

        const attrIds = ['constituicao', 'destreza', 'forca', 'carisma', 'inteligencia', 'sabedoria'];

        function calcStats() {
            // Verifica autocalc – se desmarcado, não mexe nos vitais
            const autocalcCheckbox = document.querySelector('[data-field="autocalc"]');
            if (!autocalcCheckbox || !autocalcCheckbox.checked || isLoading) return;

            const level = parseInt(document.getElementById('level').value, 10) || 0;
            const newBonus = computeBonusAttrs();

            // Atributos: base + bônus (igual antes)
            const baseAttrs = {};
            attrIds.forEach(attr => {
                const input = document.getElementById(attr);
                const displayed = parseInt(input.value, 10) || 0;
                baseAttrs[attr] = Math.max(0, displayed - bonusAttrs[attr]);
            });
            attrIds.forEach(attr => {
                const input = document.getElementById(attr);
                const total = baseAttrs[attr] + newBonus[attr];
                input.value = total;
                bonusAttrs[attr] = newBonus[attr];
            });

            const attrs = {};
            attrIds.forEach(attr => {
                attrs[attr] = parseInt(document.getElementById(attr).value, 10) || 0;
            });

            const classeNome = document.querySelector('[data-field="classe"]').value;

            // ---- VITAIS ----
            // PV e PM: sincronização condicional
            ['pv', 'pm'].forEach(stat => {
                const maxInput = document.getElementById(stat + '-max');
                const atualInput = document.getElementById(stat + '-atual');
                if (!maxInput || !atualInput) return;

                const classeMap = statFormulas[stat + '-max'];
                const formula = typeof classeMap[classeNome] === 'function'
                    ? classeMap[classeNome]
                    : (classeMap['default'] || (() => 0));
                const newMax = Math.floor(formula(attrs, level));

                const oldMax = parseInt(maxInput.value, 10) || 0;
                const oldAtual = parseInt(atualInput.value, 10) || 0;

                // Verifica se estava sincronizado
                if (oldAtual === oldMax || (oldMax === 0 && oldAtual === 0)) {
                    // Sincronizado: atualiza ambos
                    atualInput.value = newMax;
                } else {
                    // Não sincronizado: mantém o atual, exceto se exceder o novo máx
                    if (oldAtual > newMax) {
                        atualInput.value = newMax; // ou poderia manter, mas forçar correção é seguro
                    }
                }
                maxInput.value = newMax;

                // Alerta
                const alertaSpan = document.getElementById(stat + '-alerta');
                if (alertaSpan) {
                    const atualVal = parseInt(atualInput.value, 10) || 0;
                    alertaSpan.style.display = (atualVal > newMax) ? 'inline' : 'none';
                }
            });

            // PT: máximo pela fórmula, atual = soma dos poder-pt
            const ptMaxInput = document.getElementById('pt-max');
            const ptAtualInput = document.getElementById('pt-atual');
            if (ptMaxInput && ptAtualInput) {
                const ptFormulaMap = statFormulas['pt-max'];
                const ptFormula = typeof ptFormulaMap[classeNome] === 'function'
                    ? ptFormulaMap[classeNome]
                    : (ptFormulaMap['default'] || (() => 0));
                const maxPT = Math.floor(ptFormula(attrs, level));
                ptMaxInput.value = maxPT;

                // Soma de todos os poder-pt nos cartões
                let somaPT = 0;
                document.querySelectorAll('.poder-pt').forEach(input => {
                    somaPT += parseInt(input.value, 10) || 0;
                });
                ptAtualInput.value = somaPT;

                // Alerta
                const ptAlerta = document.getElementById('pt-alerta');
                if (ptAlerta) {
                    const atualVal = parseInt(ptAtualInput.value, 10) || 0;
                    ptAlerta.style.display = (atualVal > maxPT) ? 'inline' : 'none';
                }
            }

            // INV e LA: máximo calculado, atual NÃO é alterado
            ['inv', 'la'].forEach(stat => {
                const maxInput = document.getElementById(stat + '-max');
                const atualInput = document.getElementById(stat + '-atual');
                if (!maxInput || !atualInput) return;

                const classeMap = statFormulas[stat + '-max'];
                const formula = typeof classeMap[classeNome] === 'function'
                    ? classeMap[classeNome]
                    : (classeMap['default'] || (() => 0));
                const newMax = Math.floor(formula(attrs, level));
                maxInput.value = newMax;

                // Alerta se atual > max
                const alertaSpan = document.getElementById(stat + '-alerta');
                if (alertaSpan) {
                    const atualVal = parseInt(atualInput.value, 10) || 0;
                    alertaSpan.style.display = (atualVal > newMax) ? 'inline' : 'none';
                }
            });

            // DEF (igual, mas sem array)
            const defInput = document.getElementById('def');
            if (defInput) {
                const defMap = statFormulas['def'];
                const defFormula = typeof defMap[classeNome] === 'function'
                    ? defMap[classeNome]
                    : (defMap['default'] || (() => 0));
                defInput.value = Math.floor(defFormula(attrs, level));
            }

        }


        // CARREGADORES DE PODERES E TALS
        let poderRowCounter = 0;
        let autoAddedRow = null;

        function criarPoderRow(idCounter, classesExtras) {
            const row = document.createElement('div');
            row.className = 'poder-row' + (classesExtras ? ' ' + classesExtras : '');
            row.dataset.row = idCounter;

            row.innerHTML = `
    <label>Poder:
      <input type="number" class="poder-pt" id="poder-pt-${idCounter}" data-field="poder-pt" placeholder="PT">
      <input type="text" class="poder-nome" id="poder-nome-${idCounter}" data-field="poder-nome" list="poderes-sugestoes" placeholder="Nome do poder">
      <input type="text" class="poder-custo" id="poder-custo-${idCounter}" data-field="poder-custo-nome" placeholder="Custo">
      <br>
      <textarea class="poder-desc" id="poder-desc-${idCounter}" data-field="poder-desc" placeholder="Descrição" rows="3"></textarea>
    </label>
    <button type="button" class="delete-poder-btn" title="Remover poder">tira o poder</button>
  `;
            return row;
        }

        function adicionarPoder() {
            poderRowCounter++;
            const container = document.getElementById('poderes-container');
            const novaRow = criarPoderRow(poderRowCounter);
            container.appendChild(novaRow);
        }

        function configurarDelegacaoPoderes() {
            const container = document.getElementById('poderes-container');

            // Excluir poder
            container.addEventListener('click', function (e) {
                if (e.target.classList.contains('delete-poder-btn')) {
                    const row = e.target.closest('.poder-row');
                    if (row) {
                        if (row === autoAddedRow) autoAddedRow = null;
                        row.remove();
                        calcStats(); // PT pode mudar
                    }
                }
            });

            // Preenchimento automático e soma de PT
            container.addEventListener('input', function (e) {
                if (e.target.classList.contains('poder-nome')) {
                    const row = e.target.closest('.poder-row');
                    preencherDadosPoder(row, e.target.value);
                }
                if (e.target.classList.contains('poder-pt')) {
                    calcStats(); // PT atual muda
                }
            });

            container.addEventListener('change', function (e) {
                if (e.target.classList.contains('poder-nome')) {
                    const row = e.target.closest('.poder-row');
                    preencherDadosPoder(row, e.target.value);
                }
                if (e.target.classList.contains('poder-pt')) {
                    calcStats();
                }
            });
        }

        let poderesData = [];

        function atualizarSugestoes() {
            const datalist = document.getElementById('poderes-sugestoes');
            datalist.innerHTML = '';
            poderesData.forEach(p => {
                const option = document.createElement('option');
                option.value = p.nome;
                datalist.appendChild(option);
            });
        }

        function preencherDadosPoder(rowElement, nomePoder) {
            const nomeNormalizado = nomePoder.trim().toLowerCase();
            const poder = poderesData.find(p => p.nome.toLowerCase() === nomeNormalizado);
            if (poder) {
                rowElement.querySelector('.poder-pt').value = poder.pt;
                rowElement.querySelector('.poder-custo').value = poder.custo;
                rowElement.querySelector('.poder-desc').value = poder.desc;
            } else {
                rowElement.querySelector('.poder-pt').value = '';
                rowElement.querySelector('.poder-custo').value = '';
                rowElement.querySelector('.poder-desc').value = '';
            }
            calcStats();
        }

        fetch('poderes.json')
            .then(response => {
                if (!response.ok) throw new Error('Erro ao carregar poderes.json');
                return response.json();
            })
            .then(data => {
                poderesData = data;
                atualizarSugestoes();
                syncHabilidadeAuto();
            })
            .catch(error => {
                console.error('Falha ao carregar os poderes:', error);
            });

        function syncHabilidadeAuto() {
            const habCheck = document.querySelector('[data-field="habilidadeAdquirida"]');
            const heranca = document.querySelector('[data-field="heranca"]').value;
            const nomePoder = herancaHabilidades[heranca];

            if (habCheck && habCheck.checked && nomePoder) {
                if (autoAddedRow && !document.body.contains(autoAddedRow)) {
                    autoAddedRow = null;
                }

                if (!autoAddedRow) {
                    poderRowCounter++;
                    autoAddedRow = criarPoderRow(poderRowCounter, 'auto-poder');
                    document.getElementById('poderes-container').appendChild(autoAddedRow);
                }

                const nomeInput = autoAddedRow.querySelector('.poder-nome');
                if (nomeInput.value !== nomePoder) {
                    nomeInput.value = nomePoder;
                    preencherDadosPoder(autoAddedRow, nomePoder);
                }
            } else {
                if (autoAddedRow && document.body.contains(autoAddedRow)) {
                    autoAddedRow.remove();
                }
                autoAddedRow = null;
            }
        }

        function gatherSheetData() {
            const data = {};

            // 1. Simple fields (elements with data-field that are NOT inside .poder-row)
            document.querySelectorAll('[data-field]').forEach(el => {
                // Skip any element that is inside a power row (we handle them separately)
                if (el.closest('.poder-row')) return;
                data[el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value;
            });

            // 2. Power rows
            const powerRows = document.querySelectorAll('.poder-row');
            const poderes = [];
            powerRows.forEach(row => {
                const nomeInput = row.querySelector('[data-field="poder-nome"]');
                const ptInput = row.querySelector('[data-field="poder-pt"]');
                const custoInput = row.querySelector('[data-field="poder-custo-nome"]');
                const descInput = row.querySelector('[data-field="poder-desc"]');
                // Only push if at least the nome has something (or you might push all, even empty)
                poderes.push({
                    nome: nomeInput ? nomeInput.value : '',
                    pt: ptInput ? ptInput.value : '',
                    custo: custoInput ? custoInput.value : '',
                    desc: descInput ? descInput.value : '',
                    isAuto: row.classList.contains('auto-poder') // remember if it was auto-added
                });
            });
            data.poderes = poderes;

            // 3. Portrait URL
            const retratoImg = document.getElementById('retrato-img');
            data.retratoUrl = (retratoImg.style.display !== 'none' && retratoImg.src) ? retratoImg.src : '';

            return data;
        }

        async function autoSaveToFirebase() {
            if (!currentUser || !sheetId) return;
            const dados = gatherSheetData();
            try {
                const docRef = db.collection('sheets').doc(sheetId);
                await docRef.set({
                    owner: currentUser.uid,
                    name: dados.nome || 'Sem nome',
                    data: dados,
                    lastModified: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                document.getElementById('output').textContent = '☁️ Salvo na nuvem às ' + new Date().toLocaleTimeString();
            } catch (e) {
                document.getElementById('output').textContent = 'Erro ao salvar: ' + e.message;
            }
        }

        let autoSaveTimeout;

        function agendarAutoSave() {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(() => {
                autoSaveToFirebase();
            }, 2000); // 2 seconds after the last change
        }


        function fillSheetData(data) {
            if (!data) return;
            isLoading = true;   // 🔇 suppress calcStats

            // ---- Simple fields ----
            document.querySelectorAll('[data-field]').forEach(el => {
                if (el.closest('.poder-row')) return; // skip powers
                if (data[el.dataset.field] !== undefined) {
                    if (el.type === 'checkbox') {
                        el.checked = data[el.dataset.field];
                    } else {
                        el.value = data[el.dataset.field];
                    }
                }
            });

            // ---- Power rows ----
            // Remove all existing power rows (including auto-added)
            const container = document.getElementById('poderes-container');
            container.innerHTML = '';
            poderRowCounter = 0; // reset counter
            autoAddedRow = null;

            if (Array.isArray(data.poderes)) {
                data.poderes.forEach(poder => {
                    poderRowCounter++;
                    const row = criarPoderRow(poderRowCounter, poder.isAuto ? 'auto-poder' : '');
                    container.appendChild(row);
                    // Set values
                    row.querySelector('[data-field="poder-nome"]').value = poder.nome || '';
                    row.querySelector('[data-field="poder-pt"]').value = poder.pt || '';
                    row.querySelector('[data-field="poder-custo-nome"]').value = poder.custo || '';
                    row.querySelector('[data-field="poder-desc"]').value = poder.desc || '';
                    if (poder.isAuto) {
                        autoAddedRow = row; // remember for future sync
                    }
                });
            }

            // ---- Portrait ----
            const url = data.retratoUrl;
            if (url) {
                // Use the existing atualizarRetrato function
                atualizarRetrato(url);
            } else {
                atualizarRetrato('');
            }

            // ---- Re-enable autocalc ----
            isLoading = false;

            // Now that all values are set, update dependent UI and optionally recalc
            updateRamos();
            updateAprendizadoChoice();
            enforceNivel12Checkboxes();
            updateFortuna();
            syncHabilidadeAuto();
            updateHiddenByLevel();

            const autocalcCheckbox = document.querySelector('[data-field="autocalc"]');
            if (autocalcCheckbox && autocalcCheckbox.checked) {
                // Also update bonusAttrs to match new values before recalc
                updateBonusAttrs(); // Will fill bonusAttrs object
                calcStats(); // now it will run because isLoading is false
            } else {
                // If autocalc is off, we still need to update bonusAttrs so UI is consistent
                updateBonusAttrs();
                // but do NOT run calcStats
            }
        }


        // Tudo abaixo percebe interações
        document.addEventListener('input', (e) => {
            // Only react to inputs that are inside the sheet (not inside the buttons area, etc.)
            if (e.target.closest('.sheet-wrapper') || e.target.closest('body')) {
                agendarAutoSave();
            }
        });
        document.addEventListener('change', (e) => {
            if (e.target.closest('.sheet-wrapper') || e.target.closest('body')) {
                agendarAutoSave();
            }
        });


        ['constituicao', 'destreza', 'forca', 'carisma', 'inteligencia', 'sabedoria'].forEach(id =>
            document.getElementById(id).addEventListener('input', calcStats)
        );

        document.getElementById('level').addEventListener('input', () => {
            updateHiddenByLevel();
            enforceNivel12Checkboxes();
            updateFortuna();
            calcStats();
        });

        document.querySelector('[data-field="classe"]').addEventListener('change', () => {
            updateRamos();
            calcStats();
        });

        document.querySelector('[data-field="heranca"]').addEventListener('change', () => {
            updateFortuna();
            updateAprendizadoChoice();
            syncHabilidadeAuto();
            calcStats();
        });

        bonusCheckboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                updateAprendizadoChoice();
                updateFortuna();
                syncHabilidadeAuto();
                calcStats();
            });
        });

        document.querySelector('[data-field="aprendizadoEscolha"]').addEventListener('change', calcStats);

        document.getElementById('save-btn').addEventListener('click', () => {
            const data = gatherSheetData();
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ficha.json';  // or use character name if available
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            // Feedback
            document.getElementById('output').textContent = 'Ficha salva!';
        });

        const loadFileInput = document.getElementById('load-file-input');
        document.getElementById('load-btn').addEventListener('click', () => {
            loadFileInput.click();
        });

        loadFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    fillSheetData(data);
                    document.getElementById('output').textContent = 'Ficha carregada!';
                } catch (err) {
                    alert('Arquivo inválido!');
                }
            };
            reader.readAsText(file);
            // reset input so user can load same file again
            loadFileInput.value = '';
        });


        // Iniciadores com a página
        updateRamos();
        updateAprendizadoChoice();
        enforceNivel12Checkboxes();
        updateFortuna();
        syncHabilidadeAuto();
        calcStats();

        configurarDelegacaoPoderes();
        for (let i = 0; i < 3; i++) {
            adicionarPoder();
        }
        document.getElementById('add-poder-btn').addEventListener('click', adicionarPoder);
    </script>
</body>

</html>
